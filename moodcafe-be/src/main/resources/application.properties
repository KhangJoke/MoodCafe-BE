spring.application.name=moodcafe-be

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =========================
# REDIS
# =========================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
jwt.refresh-expiration=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}
# =========================
# SMTP (MAIL)
# =========================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.from=${SMTP_FROM_EMAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_ENABLE_SSL:false}

spring.mail.properties.mail.debug=true
logging.level.org.springframework.mail=DEBUG
logging.level.org.eclipse.angus.mail=DEBUG

spring.jpa.hibernate.ddl-auto=validate


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# =========================
# THYMELEAF
# =========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# =========================
# CLOUDINARY
# =========================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# =========================
# OAUTH2 SOCIAL LOGIN
# =========================
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
facebook.app-id=${FACEBOOK_APP_ID:}
facebook.app-secret=${FACEBOOK_APP_SECRET:}

# =========================
# COOKIE SECURITY
# =========================
app.security.cookie-secure=${COOKIE_SECURE:true}

# =========================
# TIMEZONE & DATE SERIALIZATION
# =========================
spring.jackson.time-zone=UTC
app.store.default-timezone=Asia/Ho_Chi_Minh

# =========================
# MULTIPART / FILE UPLOAD
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=100MB