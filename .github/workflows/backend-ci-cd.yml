name: Backend CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "moodcafe-be/**"
      - ".github/workflows/backend-ci-cd.yml"
  push:
    branches: [main]
    paths:
      - "moodcafe-be/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

concurrency:
  group: moodcafe-backend-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: moodcafe-backend
  EC2_INSTANCE_ID: i-03046026169ea6eb5

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moodcafe-be
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: ./mvnw --batch-mode verify

  publish-and-deploy:
    name: Publish image and deploy to EC2
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: image
        working-directory: moodcafe-be
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_tag="release-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          image_uri="$REGISTRY/${ECR_REPOSITORY}:$image_tag"
          docker build --tag "$image_uri" .
          docker push "$image_uri"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "Published $image_uri"

      - name: Ask Systems Manager to deploy the image
        id: deploy
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MoodCafe backend $IMAGE_TAG" \
            --parameters commands="sudo /opt/moodcafe/deploy.sh $IMAGE_TAG" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "Started SSM command: $command_id"

      - name: Wait for deployment result
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          for attempt in {1..90}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment ended with status: $status"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
              *)
                echo "Deployment status: ${status:-pending} (attempt $attempt/90)"
                sleep 5
                ;;
            esac
          done

          echo "Timed out waiting for SSM deployment command $COMMAND_ID"
          exit 1
